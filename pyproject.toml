[project]
name = "customer-intelligence-platform"
version = "0.1.0"
description = "End-to-end Customer Intelligence Platform using FastAPI, DuckDB and Machine Learning."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.14.2",
    "polars>=1.43.2",
    "duckdb>=1.5.5",
    "pyarrow>=25.0.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.59.1",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "joblib>=1.5.3",
]

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "mypy>=1.18.2",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = [
    "app",
    "pipelines",
]

##################################
# uv
##################################

[tool.uv]
package = true

##################################
# Ruff
##################################

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]

##################################
# MyPy
##################################

[tool.mypy]
python_version = "3.12"
strict = true

##################################
# Pytest
##################################

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = ["."]
